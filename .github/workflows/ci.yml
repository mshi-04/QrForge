name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    # 毎週月曜 06:00 JST。コード変更なしに公開される advisory を検出する。
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    name: Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository consistency
        run: python3 scripts/check_repo_consistency.py

  rust:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt, clippy

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Lint Rust (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Build Rust JNI crate
        run: cargo build --manifest-path rust/qrforge-jni/Cargo.toml

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o "$RUNNER_TEMP/qrforge-jniLibs" build --release --manifest-path rust/qrforge-jni/Cargo.toml

      - name: Check native libraries were generated
        run: |
          test -f "$RUNNER_TEMP/qrforge-jniLibs/arm64-v8a/libqrforge.so"
          test -f "$RUNNER_TEMP/qrforge-jniLibs/armeabi-v7a/libqrforge.so"
          test -f "$RUNNER_TEMP/qrforge-jniLibs/x86_64/libqrforge.so"

  rust-audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml
          command: check
          arguments: --all-features

  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # cache は develop でだけ生成し、他の branch は読むだけにする。feature branch は
          # develop 向け PR の base branch cache として、これを使い回す。
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # lifecycle task ではなく個別の task path を指定する。built-in Kotlin の source set
      # 検出が壊れた場合に、0 件 lint して成功するのではなく task not found で落とすため。
      - name: Check Kotlin format and style
        run: ./gradlew :qrforge:ktlintCheck :app:ktlintCheck ktlintKotlinScriptCheck --no-daemon

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check public API compatibility
        run: |
          ./gradlew :qrforge:assembleRelease --no-daemon
          python3 scripts/check_public_api.py

      - name: Run Android checks
        run: ./gradlew :qrforge:testDebugUnitTest :qrforge:assembleDebug :qrforge:assembleDebugAndroidTest :app:assembleDebug --no-daemon

  instrumented:
    name: Instrumented Test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 週次実行で emulator を 2 本起動する価値は薄い。
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk。Google APIs を使わないため default image で足りる。
          - api-level: 28
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check committed x86_64 native library
        run: test -f qrforge/src/main/jniLibs/x86_64/libqrforge.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: ./gradlew :qrforge:connectedDebugAndroidTest --no-daemon
