name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    name: Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check repository consistency
        run: python3 scripts/check_repo_consistency.py

  rust:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        run: rustup toolchain install

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Lint Rust (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets

      - name: Test Rust documentation
        run: cargo test -p qr-forge-core --doc

      - name: Build Rust JNI crate
        run: cargo build --manifest-path rust/qr-forge-jni/Cargo.toml

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o "$RUNNER_TEMP/qr-forge-jniLibs" build --release --manifest-path rust/qr-forge-jni/Cargo.toml

      - name: Check native libraries were generated
        run: |
          test -f "$RUNNER_TEMP/qr-forge-jniLibs/arm64-v8a/libqrforge.so"
          test -f "$RUNNER_TEMP/qr-forge-jniLibs/armeabi-v7a/libqrforge.so"
          test -f "$RUNNER_TEMP/qr-forge-jniLibs/x86_64/libqrforge.so"

      - name: Check 16 KB page size alignment
        run: python3 scripts/check_native_alignment.py "$RUNNER_TEMP/qr-forge-jniLibs"

  rust-audit:
    name: Rust Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml
          command: check
          arguments: --all-features

  kotlin-lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Gradle build
        uses: ./.github/actions/setup-gradle-build

      - name: Check Kotlin format and style
        run: ./gradlew :qr-forge:ktlintCheck :app:ktlintCheck ktlintKotlinScriptCheck --no-daemon

  android:
    name: Android Build
    runs-on: ubuntu-latest
    env:
      PUBLICATION_SMOKE_VERSION: "0.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Gradle build
        uses: ./.github/actions/setup-gradle-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Check public API compatibility
        run: |
          ./gradlew :qr-forge:assembleRelease --no-daemon
          python3 scripts/check_public_api.py

      - name: Verify Maven publication
        shell: bash
        run: |
          ./gradlew :qr-forge:publishToMavenLocal "-PVERSION_NAME=$PUBLICATION_SMOKE_VERSION" --no-daemon --no-configuration-cache
          artifacts="$HOME/.m2/repository/io/github/lambdarc/qr-forge/$PUBLICATION_SMOKE_VERSION"
          test -f "$artifacts/qr-forge-$PUBLICATION_SMOKE_VERSION.pom"
          test -f "$artifacts/qr-forge-$PUBLICATION_SMOKE_VERSION.aar"
          javadoc="$artifacts/qr-forge-$PUBLICATION_SMOKE_VERSION-javadoc.jar"
          documented="$(unzip -Z1 "$javadoc" | grep -cv '^META-INF/')"
          test "$documented" -gt 0

      - name: Build consumer from published coordinates
        shell: bash
        run: |
          ./gradlew -p consumer-smoke assembleRelease "-PQR_FORGE_VERSION=$PUBLICATION_SMOKE_VERSION" --no-daemon
          apk=consumer-smoke/build/outputs/apk/release/consumer-smoke-release-unsigned.apk
          abis="$(unzip -Z1 "$apk" | grep -cE '^lib/(arm64-v8a|armeabi-v7a|x86_64)/libqrforge\.so$')"
          test "$abis" -eq 3
          python3 scripts/check_consumer_proguard.py "$apk"

      - name: Check consumer ProGuard rules
        run: |
          ./gradlew :app:assembleRelease :qr-forge:assembleRelease --no-daemon
          python3 scripts/check_consumer_proguard.py

      - name: Run Android checks
        run: ./gradlew :qr-forge:testDebugUnitTest :qr-forge:assembleDebug :qr-forge:assembleDebugAndroidTest :app:assembleDebug --no-daemon

  instrumented:
    name: Instrumented Test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            target: default
          - api-level: 34
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check committed x86_64 native library
        run: test -f qr-forge/src/main/jniLibs/x86_64/libqrforge.so

      - name: Setup Gradle build
        uses: ./.github/actions/setup-gradle-build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: ./gradlew :qr-forge:connectedDebugAndroidTest --no-daemon
