[package]
name = "qrforge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# qrcode の "image" feature は render::image 用で、本 crate は自前で ImageBuffer を組む
# ため不要。有効にすると image が default features (jpeg/gif/tiff/webp/moxcms 等) 込みで
# 引き込まれ、native library が肥大するので付けない。
image = { version = "0.25.10", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
# integration test で生成 PNG のピクセルを検証するために使う。
image = { version = "0.25.10", default-features = false, features = ["png"] }
