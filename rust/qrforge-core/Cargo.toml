[package]
name = "qrforge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# qrcode の "image" feature は render::image 用で、本 crate は raw pixel buffer を直接
# PNG にエンコードするため不要。
png = { version = "0.18.1", default-features = false }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
# 生成 PNG のピクセルを integration test でデコードして検証するために使う。
image = { version = "0.25.10", default-features = false, features = ["png"] }
